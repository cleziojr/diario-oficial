name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - name: Go test
        run: go test ./... -count=1 -race

  backend-lint:
    name: Backend — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          working-directory: backend

  docker-smoke:
    name: Docker — build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Wait for /ready
        run: |
          for i in $(seq 1 30); do
            status=$(curl -sf http://localhost:8080/ready | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "")
            if [ "$status" = "ready" ]; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout waiting for /ready"
          docker compose logs api
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

  record-deploy:
    name: DORA — record deployment
    runs-on: ubuntu-latest
    needs: [backend-test, backend-lint, docker-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute lead time (merge → deploy, in minutes)
        id: lead_time
        run: |
          pr_merged_at=$(git log -1 --format="%aI" HEAD)
          now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          merged_epoch=$(date -d "$pr_merged_at" +%s)
          now_epoch=$(date -d "$now" +%s)
          diff_min=$(( (now_epoch - merged_epoch) / 60 ))
          echo "lead_time_minutes=${diff_min}" >> "$GITHUB_OUTPUT"
          echo "Lead time: ${diff_min} minutes"

      - name: Summary
        run: |
          echo "## DORA — deploy registrado" >> "$GITHUB_STEP_SUMMARY"
          echo "| Métrica | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frequência de deploy | 1 deploy (este push em main) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lead time for changes | ${{ steps.lead_time.outputs.lead_time_minutes }} minutos |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Timestamp | $(date -u) |" >> "$GITHUB_STEP_SUMMARY"
