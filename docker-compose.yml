services:
  postgres:
    image: postgres:16-alpine
    container_name: diario-oficial-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diario}
      POSTGRES_DB: ${POSTGRES_DB:-diario_oficial}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diario} -d ${POSTGRES_DB:-diario_oficial}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diario-oficial-api
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-diario}:${POSTGRES_PASSWORD:-diario}@postgres:5432/${POSTGRES_DB:-diario_oficial}?sslmode=disable"
      AI_SERVICE_URL: "http://ai-service:9090"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.5
    container_name: diario-oficial-ollama
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.6.5
    container_name: diario-oficial-ollama-pull
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3.2} && echo 'model ready'"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: no

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: diario-oficial-ai
    expose:
      - "9090"
    environment:
      AI_ADDR: ":9090"
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pdf-extraction:
    build:
      context: .
      dockerfile: pdf-extraction/Dockerfile
    container_name: diario-oficial-pdf
    environment:
      BACKEND_URL: "http://api:8080"
      DOCUMENT_ID: ${DOCUMENT_ID:-}
      PDF_PATH: ${PDF_PATH:-}
    volumes:
      - ${PDF_DIR:-./pdfs}:/pdfs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: no

volumes:
  postgres_data:
  ollama_data: