services:
  postgres:
    image: postgres:16-alpine
    container_name: diario-oficial-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diario}
      POSTGRES_DB: ${POSTGRES_DB:-diario_oficial}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diario} -d ${POSTGRES_DB:-diario_oficial}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diario-oficial-api
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-diario}:${POSTGRES_PASSWORD:-diario}@postgres:5432/${POSTGRES_DB:-diario_oficial}?sslmode=disable"
      AI_SERVICE_URL: "http://ai-service:9090"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.5
    container_name: diario-oficial-ollama
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    profiles:
      - ollama

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: diario-oficial-ai
    expose:
      - "9090"
    environment:
      AI_ADDR: ":9090"
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
